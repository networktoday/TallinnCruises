name: viabaltica

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  viabaltica-db-data:

services:
  db:
    image: postgres:17-alpine
    container_name: viabaltica-db
    networks:
      - internal
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - viabaltica-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: viabaltica-app
    networks:
      - proxy
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
