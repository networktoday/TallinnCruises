name: viabaltica

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  viabaltica-db-data:

services:
  db:
    image: postgres:17-alpine
    container_name: viabaltica-db
    networks:
      - internal
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - viabaltica-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./services/backoffice
    container_name: viabaltica-api
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - internal
    environment:
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - SITE_URL=${SITE_URL:-https://privatetourstallinn.com}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL:-info@viabaltica.eu}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    build: .
    container_name: viabaltica-app
    networks:
      - proxy
      - internal
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 e non "localhost": nginx ascolta solo su IPv4 (0.0.0.0:5000)
      # e busybox-wget prova prima ::1 -> connection refused.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
